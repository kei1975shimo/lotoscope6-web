<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c101b">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="西洋占星術・カバラ数秘術・タロットと誕生日から、今日の数字を受け取るロト・スコープ。">
  <title>{% block title %}ロト・スコープ{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=app_version) }}">
  <script defer src="{{ url_for('static', filename='js/app.js', v=app_version) }}"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">本文へ移動</a>
  <header class="app-bar">
    <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark" aria-hidden="true">✧</span><span>ロト・スコープ<small>LOTO SCOPE</small></span></a>
    <span class="daily-stamp"><span aria-hidden="true">☾</span> DAILY ORACLE</span>
  </header>
  <main id="main-content" class="app-shell" data-theme="{% block theme %}astrology{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="app-footer">
    <span class="footer-mark" aria-hidden="true">✧</span>
    <p>数字を選ぶひとときに、小さな神秘を。</p>
    <small>占いによる数字生成はエンターテインメントです。点数は当せん確率を表すものではなく、当せんを保証するものでもありません。抽せん結果は宝くじ公式情報でご確認ください。</small>
    <span class="version">LOTO SCOPE · {{ app_version }}</span>
  </footer>
  {% include "ritual.html" %}
</body>
</html>
