services:
  - type: web
    name: lotoscope6-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
